name: 'VisualQ Quality Gates'
description: 'Run VisualQ quality gates in CI — visual regression, perf budgets, SEO, a11y, security, tracking, and FRT functional tests'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  api-key:
    description: 'VisualQ API key'
    required: true
  project:
    description: 'VisualQ project slug'
    required: true
  type:
    description: 'Run type: test, baseline, perf, seo, a11y, security, tracking, or frt'
    default: 'test'
  feature-ids:
    description: 'Comma-separated FRT feature IDs (only when type=frt)'
    required: false
  scenarios:
    description: 'Comma-separated scenario labels to test'
    required: false
  wait:
    description: 'Wait for run completion (true/false)'
    default: 'true'
  api-url:
    description: 'VisualQ API base URL'
    default: 'https://visualq.ai'
  browsers:
    description: 'Comma-separated browsers to test: chromium,firefox,webkit'
    required: false
  environment:
    description: 'Environment name or slug to run tests against (e.g. staging, production)'
    required: false
  jira-key:
    description: 'Jira issue key to link results to (e.g. PROJ-123)'
    required: false
  perf-budgets:
    description: 'JSON performance budgets, e.g. {"lcp":2500,"cls":0.1,"score":75}'
    required: false
  a11y-budgets:
    description: 'JSON accessibility budgets, e.g. {"minScore":80,"maxCritical":0,"maxNewViolations":0}'
    required: false
  locale:
    description: 'Output language for action logs (en, fr, es, de, it, pt, pt-BR, nl, pl, tr, ru, zh, ja, ko, ar, hi). Auto-detected from LANG/VISUALQ_LOCALE env vars when omitted.'
    required: false

outputs:
  run-id:
    description: 'The VRT run ID'
  status:
    description: 'Run status: completed or failed'
  passed:
    description: 'Number of passed scenarios'
  failed:
    description: 'Number of failed scenarios'
  frt-failed-steps:
    description: 'Number of failed FRT steps when type=frt'
  report-url:
    description: 'URL to the visual report'
  perf-score:
    description: 'Performance score (0-100) when type=perf'
  seo-score:
    description: 'SEO score (0-100) when type=seo'
  a11y-score:
    description: 'Accessibility score (0-100) when type=a11y or when a11y budgets are set'
  a11y-critical-count:
    description: 'Critical accessibility violation count when type=a11y'

runs:
  using: 'node20'
  main: 'dist/index.js'
